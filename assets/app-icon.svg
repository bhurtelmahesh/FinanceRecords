    <rect x="228" y="174" width="520" height="664" rx="58" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.58"/>
    <rect x="294" y="272" width="272" height="24" rx="12" fill="#bedbe2"/>
    <rect x="294" y="354" width="364" height="22" rx="11" fill="#d4e8ec"/>
    <rect x="294" y="432" width="260" height="22" rx="11" fill="#d4e8ec"/>
