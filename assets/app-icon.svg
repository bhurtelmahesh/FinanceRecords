<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Finance Records App Icon</title>
  <desc id="desc">A polished finance app icon with a ledger, yen coin, and growth chart.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="870" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c7fa5"/>
      <stop offset="0.52" stop-color="#1f9d91"/>
      <stop offset="1" stop-color="#57b85f"/>
    </linearGradient>
    <linearGradient id="paper" x1="250" y1="190" x2="770" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="640" y1="205" x2="840" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe27c"/>
      <stop offset="1" stop-color="#f4a928"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#14343a" flood-opacity="0.28"/>
