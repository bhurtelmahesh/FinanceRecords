    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12313a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <path d="M138 236c100-92 219-137 358-137 216 0 349 100 426 239v427c-81 95-209 154-383 154-248 0-401-117-461-292z" fill="#ffffff" opacity="0.12"/>
  <path d="M134 780c155-67 293-62 415 16 109 70 216 82 321 36v54c-72 75-193 124-349 124-201 0-345-76-431-204z" fill="#0d4c65" opacity="0.15"/>

